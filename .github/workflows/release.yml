# Release workflow of D-HELPER.
# It runs on each push to main (merge of the pull request dev -> main).
# It builds d-helper.exe and publishes it in a GitHub release with the tag sha-<short>.
name: release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      # Necessary to make the tag and the release.
      contents: write
    env:
      CGO_ENABLED: "0"
    steps:
      - name: Get the source code
        uses: actions/checkout@v7
        with:
          # Get the full history. The release notes step reads the commits of the push.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Calculate the version
        id: vars
        run: echo "version=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Verify the code
        run: |
          go vet ./...
          GOOS=windows GOARCH=amd64 go vet ./...
          go test ./...

      - name: Build the Windows program
        env:
          GOOS: windows
          GOARCH: amd64
          VERSION: ${{ steps.vars.outputs.version }}
        run: go build -trimpath -ldflags "-s -w -H=windowsgui -X main.version=${VERSION}" -o dist/d-helper.exe .

      - name: Make the checksum file
        working-directory: dist
        run: |
          sha256sum d-helper.exe > d-helper.exe.sha256
          cat d-helper.exe.sha256

      # Release notes: the commit subjects of this push, without the technical domains.
      # Refer to D-OPS docs/conventions.md, sections 9 and 14.
      - name: Make the release notes
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            range=("${BEFORE}..${GITHUB_SHA}")
          else
            range=(-1 "${GITHUB_SHA}")
          fi
          notes=$(git log --no-merges --format=%s "${range[@]}" \
            | grep -Ev '^(CI|Docker|Git|Doc|Santé|Sauvegarde|Config|Style) : ' || true)
          {
            echo "## Modifications"
            if [ -n "$notes" ]; then
              while IFS= read -r line; do
                echo "- $line"
              done <<< "$notes"
            else
              echo "Aucune modification visible."
            fi
            echo
            echo "## Installation"
            echo "Télécharger \`d-helper.exe\`, puis lancer \`d-helper.exe --install\`. Voir le README du dépôt."
          } > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"

      - name: Publish the release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.vars.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: D-HELPER ${{ steps.vars.outputs.version }}
          body_path: ${{ runner.temp }}/notes.md
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            dist/d-helper.exe
            dist/d-helper.exe.sha256
