# Check workflow of D-HELPER. Refer to D-OPS docs/conventions.md, section 7.
# It runs on each push to dev and on each pull request to main.
# It builds d-helper.exe but does not publish it.
name: ci

on:
  push:
    branches: [dev]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - name: Get the source code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Verify the format of the code
        run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then
            echo "::error::Run gofmt on these files: $files"
            exit 1
          fi

      - name: Verify the code
        run: |
          go vet ./...
          GOOS=windows GOARCH=amd64 go vet ./...
          go test ./...

      - name: Build the Windows program
        env:
          GOOS: windows
          GOARCH: amd64
        run: go build -trimpath -ldflags "-s -w -H=windowsgui -X main.version=ci" -o dist/d-helper.exe .
